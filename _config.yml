resume_header_intro: "<p>Elektrik-Elektronik Mühendisi olarak telekomünikasyon teknik çizim, dokümantasyon ve sistem entegrasyonu alanlarında deneyim sahibiyim. 2G, 3G, 4G ve 5G şebeke projelerinde indoor ve outdoor teknik dosya hazırlığı, AutoCAD ile çizim ve revizyon süreçleri ile teknik uygunluk kontrolleri üzerine çalıştım. Bununla birlikte, Teknofest roket projesinde yedek aviyonik kart tasarımı, sensör entegrasyonu ve veri toplama süreçlerinde aktif rol alarak sistem düzeyinde mühendislik bakış açısı kazandım ve projede kullanılan telemetri altyapılarına teknik aşinalık edindim. Teknik çizim, analitik düşünme ve sistem odaklı yaklaşımımı geliştirerek savunma sanayii, havacılık ve teknik operasyon odaklı pozisyonlarda katkı sunmayı hedefliyorum.</p>"

